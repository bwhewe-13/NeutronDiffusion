[build-system]
requires = ["scikit-build-core >= 0.11", "pybind11 >= 2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "ndiffusion"
version = "1.0.0.dev0"
description = "Multigroup neutron diffusion solver - C++ core with Python bindings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["neutron diffusion", "c++", "pybind11", "k-eigenvalue", "nuclear engineering"]
authors = [{name = "Ben Whewell", email = "ben.whewell@pm.me"}]
requires-python = ">=3.9"
dependencies = ["numpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://bwhewe-13.github.io/NeutronDiffusion/"
Documentation = "https://bwhewe-13.github.io/NeutronDiffusion/"
Source = "https://github.com/bwhewe-13/NeutronDiffusion"
Issues = "https://github.com/bwhewe-13/NeutronDiffusion/issues"
Changelog = "https://github.com/bwhewe-13/NeutronDiffusion/blob/master/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest", "scipy"]
mesh = ["gmsh"]
nearby = ["scipy"]
# One-command contributor setup: everything CI runs across its test and lint
# jobs.  Without scipy, pytest silently *skips* the point-kinetics reference
# comparisons and the whole nearby-solution suite rather than failing.
dev = ["pytest", "scipy", "ruff", "matplotlib"]
docs = [
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx-gallery",
    "sphinxcontrib-bibtex",
    "sphinx-copybutton",
    "matplotlib",
]

[tool.scikit-build]
# Pure-Python source of the ndiffusion package
wheel.packages = ["src/ndiffusion"]
# CMake install() puts _core.so into ndiffusion/ inside the wheel

[tool.scikit-build.cmake]
build-type = "Release"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-requires = ["pytest", "scipy"]
test-command = "pytest {project}/tests -q -p no:cacheprovider"

[tool.cibuildwheel.macos]
# std::optional and friends need a 10.15 SDK on Intel; arm64 starts at 11.0
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
python_classes = ["Test*"]
# A test that stops at an iteration cap is checking an unconverged answer; the
# ones that cap on purpose say so with pytest.warns.
filterwarnings = ["error::ndiffusion.ConvergenceWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["data", "Testing", "build", "docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E741",  # ambiguous single-letter names - common in numerics (l, I)
]

[tool.ruff.lint.per-file-ignores]
# Tests build inputs inline: long literal rows and aligned compact
# multi-assignments (mesh/region construction) are clearer as written.
"tests/*" = ["E501", "E702"]
"tools/c5g7_fuel_mesh.py" = ["E702"]
